__include__: [
  './rtv4_hgnetv2_s_vehicle_keypoints.yml'
]

# Five training datasets are concatenated before the shared keypoint pipeline.
# All five JSON files must use identical categories and 31-keypoint semantics.
train_dataloader:
  shuffle: False  # a sampler and shuffle=True are mutually exclusive
  sampler:
    type: MultiDataSampler
    dataset_ratio: [25, 35, 15, 15, 10]
    max_samples: 300000
  dataset:
    type: MultiCocoDetection
    img_folders:
      - /absolute/path/to/dataset_1/images/train
      - /absolute/path/to/dataset_2/images/train
      - /absolute/path/to/dataset_3/images/train
      - /absolute/path/to/dataset_4/images/train
      - /absolute/path/to/dataset_5/images/train
    ann_files:
      - /absolute/path/to/dataset_1/annotations/train.json
      - /absolute/path/to/dataset_2/annotations/train.json
      - /absolute/path/to/dataset_3/annotations/train.json
      - /absolute/path/to/dataset_4/annotations/train.json
      - /absolute/path/to/dataset_5/annotations/train.json

    # Keep these at one when MultiDataSampler controls the sampling ratio.
    repeat_factors: [1, 1, 1, 1, 1]

# Evaluation intentionally uses one stable validation set. Change these two paths
# to the validation dataset on which you want bbox/keypoint metrics reported.
val_dataloader:
  dataset:
    img_folder: /absolute/path/to/evaluation_dataset/images/val
    ann_file: /absolute/path/to/evaluation_dataset/annotations/val.json
