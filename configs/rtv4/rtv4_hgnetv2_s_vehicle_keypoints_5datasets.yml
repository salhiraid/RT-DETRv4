__include__: [
  './rtv4_hgnetv2_s_vehicle_keypoints.yml'
]

# RT-DETRv4 distillation requires the local DINOv3 repository and checkpoint.
# `dinov3_repo_path` must be the directory that contains DINOv3's hubconf.py.
teacher_model:
  dinov3_repo_path: ./dinov3
  dinov3_weights_path: ./pretrain/dinov3_vitb16_pretrain_lvd1689m.pth

# Canonical five-class vehicle subset. `person` and any other categories in a
# source JSON are filtered out. Local category ids may differ and are remapped.
num_classes: 5
class_names: &vehicle_classes [bicycle, car, motorcycle, bus, truck]

# Each virtual epoch draws 50,000 samples from five ordinary COCO datasets.
# Child transforms stay disabled because the wrapper applies the shared pipeline.
train_dataloader:
  shuffle: True
  dataset:
    type: WeightedMultiDataset
    weights: [0.35, 0.25, 0.20, 0.12, 0.08]
    samples_per_epoch: 50000
    seed: 42
    datasets:
      - {type: CocoDetection, img_folder: /absolute/path/to/dataset_1/images/train, ann_file: /absolute/path/to/dataset_1/annotations/train.json, transforms: null, return_masks: false, remap_mscoco_category: false, num_keypoints: 31}
      - {type: CocoDetection, img_folder: /absolute/path/to/dataset_2/images/train, ann_file: /absolute/path/to/dataset_2/annotations/train.json, transforms: null, return_masks: false, remap_mscoco_category: false, num_keypoints: 31}
      - {type: CocoDetection, img_folder: /absolute/path/to/dataset_3/images/train, ann_file: /absolute/path/to/dataset_3/annotations/train.json, transforms: null, return_masks: false, remap_mscoco_category: false, num_keypoints: 31}
      - {type: CocoDetection, img_folder: /absolute/path/to/dataset_4/images/train, ann_file: /absolute/path/to/dataset_4/annotations/train.json, transforms: null, return_masks: false, remap_mscoco_category: false, num_keypoints: 31}
      - {type: CocoDetection, img_folder: /absolute/path/to/dataset_5/images/train, ann_file: /absolute/path/to/dataset_5/annotations/train.json, transforms: null, return_masks: false, remap_mscoco_category: false, num_keypoints: 31}

# Evaluation intentionally uses one stable validation set. Change these two paths
# to the validation dataset on which you want bbox/keypoint metrics reported.
val_dataloader:
  dataset:
    img_folder: /absolute/path/to/evaluation_dataset/images/val
    ann_file: /absolute/path/to/evaluation_dataset/annotations/val.json

evaluator:
  class_names: *vehicle_classes
